<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo 2 — Barra de Navegação (Navbar) no Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- 
    BARRA DE NAVEGAÇÃO (Navbar)
    Classes principais:
      .navbar             → define o componente
      .navbar-expand-lg   → empilha verticalmente abaixo de 992px (hambúrguer)
      .navbar-dark / .navbar-light → cor do texto (contraste com o fundo)
      .bg-dark / .bg-primary etc.  → cor de fundo
      .navbar-brand       → logo/nome do site
      .navbar-toggler     → botão hambúrguer (precisa dos atributos data-bs-*)
      .navbar-collapse    → conteúdo que colapsa
      .navbar-nav / .nav-link → itens do menu
      .active             → item atual/página atual
  -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <!-- Marca/Logo -->
      <a class="navbar-brand fw-bold" href="#">🚀 MeuSite</a>

      <!-- Botão hambúrguer (aparece em telas < 992px) -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Itens do menu (colapsam no hambúrguer) -->
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Serviços</a></li>
          <!-- Dropdown dentro da navbar -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Produtos</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Web Design</a></li>
              <li><a class="dropdown-item" href="#">Mobile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">Consultoria</a></li>
            </ul>
          </li>
        </ul>
        <!-- Busca à direita -->
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar...">
          <button class="btn btn-outline-success" type="submit">OK</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Conteúdo de exemplo para testar o scroll (sticky-top) -->
  <div class="container py-5">
    <h1>Navbar responsiva funcionando</h1>
    <p class="lead">Redimensione a janela para menos de 992px e veja o menu virar um botão hambúrguer.</p>
    <p class="text-muted">Role a página: a barra fica fixa no topo graças a <code>.sticky-top</code>.</p>
    <div style="height:1200px"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
